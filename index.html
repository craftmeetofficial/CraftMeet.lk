<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftMeet | Ultimate Gaming HQ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card neon-border">
            <div class="brand-logo gaming-glow"><i class="fa-solid fa-radiation"></i></div>
            <h2 class="cyber-title" id="auth-title">WELCOME BACK!</h2>
            <p id="auth-subtitle">We're so excited to see you again!</p>
            
            <div class="auth-form-container">
                <div class="form-group" id="reg-username-group" style="display: none;">
                    <label>GAMERTAG (USERNAME) <span class="req-star">*</span></label>
                    <input type="text" id="auth-username" placeholder="e.g., CyberKnight">
                </div>
                
                <div class="form-group">
                    <label>EMAIL ADDRESS <span class="req-star">*</span></label>
                    <input type="email" id="auth-email" placeholder="name@domain.com">
                </div>
                
                <div class="form-group">
                    <label>PASSWORD <span class="req-star">*</span></label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>

                <div id="reg-extras" style="display: none;">
                    <div class="form-group">
                        <label>AVATAR IMAGE URL</label>
                        <input type="text" id="auth-avatar" placeholder="Paste image link here...">
                    </div>
                    <div class="form-group">
                        <label>ABOUT ME</label>
                        <textarea id="auth-bio" rows="2" placeholder="Tell the squad about yourself..."></textarea>
                    </div>
                </div>

                <button id="main-auth-btn" onclick="handlePrimaryAuth()" class="cyber-action-btn">Log In</button>
                
                <div class="auth-switcher">
                    <span id="switch-text">Need an account?</span> 
                    <a href="#" id="switch-auth-link" onclick="toggleAuthMode(event)">Register</a>
                </div>

                <div class="auth-divider"><span>OR</span></div>

                <button id="google-login-btn" onclick="loginWithGoogle()">
                    <i class="fa-brands fa-google"></i> CONTINUE WITH GOOGLE
                </button>
            </div>
        </div>
    </div>

    <div id="reward-popup-modal" class="modal-overlay hidden">
        <div class="modal-card reward-glow-box text-center">
            <div class="animated-chest"><i class="fa-solid fa-gift fa-bounce"></i></div>
            <h2 class="reward-title">REWARD UNLOCKED!</h2>
            <p>You have accumulated 500+ Chat XP! Your legendary activity has granted you a rare profile decoration.</p>
            <div class="reward-stat-preview">Current XP Resetting by -500 for Reward Node</div>
            <button class="claim-reward-btn" onclick="claimAvatarDecoration()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> CLAIM DECORATION NOW
            </button>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay hidden">
        <div class="modal-card neon-border-magenta">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-gear cyber-magenta-text"></i> EDIT MY PROFILE</h3>
                <button class="close-modal-btn" onclick="toggleProfileModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>// AVATAR URL</label>
                    <input type="text" id="profile-pic-input" placeholder="Image Link...">
                </div>
                <div class="form-group">
                    <label>// ABOUT ME</label>
                    <textarea id="profile-bio-input" rows="3" placeholder="Bio..."></textarea>
                </div>
                <div class="form-group">
                    <label>// MAIN GAME</label>
                    <select id="profile-game-input">
                        <option value="Multi-Game Athlete">Multi-Game Athlete</option>
                        <option value="Minecraft Builder">Minecraft Builder</option>
                        <option value="Valorant Duelist">Valorant Duelist</option>
                        <option value="Apex Champion">Apex Champion</option>
                    </select>
                </div>
                <button class="save-profile-btn" onclick="saveUserProfile()">
                    <i class="fa-solid fa-floppy-disk"></i> UPDATE PROFILE
                </button>
            </div>
        </div>
    </div>

    <div id="user-card-modal" class="modal-overlay hidden">
        <div class="modal-card user-view-card neon-border">
            <div class="user-card-banner"></div>
            <button class="close-card-btn" onclick="toggleUserCardModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="user-card-avatar-wrap">
                <div class="deco-frame-container" id="view-card-deco-frame">
                    <img id="view-card-avatar" src="https://via.placeholder.com/80" alt="Gamer Avatar">
                </div>
                <div class="card-level-badge"
