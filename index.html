<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftMeet</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>

<body>

<!-- 🌍 LANGUAGE -->
<div class="lang-switch">
  <button onclick="setLang('en')">EN</button>
  <button onclick="setLang('si')">SI</button>
</div>

<!-- AUTH -->
<div id="auth-screen" class="auth-overlay">
  <!-- YOUR ORIGINAL AUTH HTML (UNCHANGED) -->
</div>

<!-- MAIN -->
<div class="dashboard-container">

  <aside class="sidebar">
    <!-- YOUR ORIGINAL SIDEBAR (UNCHANGED) -->
  </aside>

  <main class="chat-wrapper">

    <div class="panel-header">
      <h2 id="current-room-title">lobby-chat</h2>
    </div>

    <div class="messages-display" id="chat-messages"></div>

    <div id="typing-indicator" class="typing-box hidden">
      <span id="typing-user"></span> typing...
    </div>

    <!-- 💬 INPUT -->
    <div class="message-input-box">

      <button id="emoji-btn" onclick="toggleEmojiPicker()">😀</button>

      <div id="emoji-picker" class="emoji-picker hidden">
        😀 😂 😍 😎 🤣 😡 😭 😱 🔥 🎮 ❤️ 👍 👎 💀 😈 😇 🥶 😴 🤯
      </div>

      <input type="text" id="message-input"
        placeholder="Send message..."
        onkeypress="checkEnter(event)"
        oninput="handleTyping()">

      <button onclick="sendMessage()" class="send-btn">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </div>

  </main>

  <section class="right-panel">
    <!-- YOUR ORIGINAL RIGHT PANEL (UNCHANGED) -->
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
