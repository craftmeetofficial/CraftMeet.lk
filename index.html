<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftMeet // Ultimate Gaming Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="auth-overlay-container">
        <div class="auth-central-card">
            <h2 id="auth-title">WELCOME BACK!</h2>
            <p id="auth-subtitle">We're so excited to see you again!</p>
            
            <form onsubmit="event.preventDefault(); handlePrimaryAuth();">
                <div class="input-form-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="auth-email" required placeholder="name@domain.com">
                </div>
                <div class="input-form-group">
                    <label>PASSWORD</label>
                    <input type="password" id="auth-password" required placeholder="••••••••">
                </div>
                
                <div class="input-form-group" id="reg-username-group" style="display: none;">
                    <label>GAMERTAG (DISPLAY NAME)</label>
                    <input type="text" id="auth-username" placeholder="e.g., GhostRider_LK">
                </div>
                
                <div id="reg-extras" style="display: none;">
                    <div class="input-form-group">
                        <label>AVATAR IMAGE URL (OPTIONAL)</label>
                        <input type="url" id="auth-avatar" placeholder="https://image-link.com/pic.png">
                    </div>
                    <div class="input-form-group">
                        <label>SHORT BIO</label>
                        <input type="text" id="auth-bio" placeholder="Tell the lobby about yourself...">
                    </div>
                </div>

                <button type="submit" id="main-auth-btn" class="auth-primary-submit-btn">Log In</button>
            </form>

            <button onclick="loginWithGoogle()" class="auth-google-shortcut-btn">
                <i class="fa-brands fa-google"></i> Connect via Google Node
            </button>

            <p class="auth-switch-mode-footer">
                <span id="switch-text">Need an account?</span> 
                <a href="#" id="switch-auth-link" onclick="toggleAuthMode(event)">Register</a>
            </p>
        </div>
    </div>

    <div class="app-main-layout">
        
        <aside class="sidebar-wrapper">
            <div class="sidebar-header-branding">
                <h1>CRAFTMEET</h1>
                <div class="online-indicator-badge">
                    <span class="pulse-dot"></span> <span id="online-count">1</span> GAMERS ONLINE
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-title">🔊 VOICE & CHAT ZONES</div>
                <ul class="rooms-list-ul">
                    <li class="room-item active" id="room-global" onclick="switchRoom('global')">
                        <i class="fa-solid fa-hashtag"></i> <span>global-zone</span>
                    </li>
                    <li class="room-item" id="room-minecraft" onclick="switchRoom('minecraft')">
                        <i class="fa-solid fa-cube"></i> <span>minecraft-zone</span>
                    </li>
                    <li class="room-item" id="room-gta" onclick="switchRoom('gta')">
                        <i class="fa-solid fa-car"></i> <span>gta-zone</span>
                    </li>
                    <li class="room-item" id="room-cod" onclick="switchRoom('cod')">
                        <i class="fa-solid fa-crosshairs"></i> <span>cod-zone</span>
                    </li>
                </ul>
            </div>

            <div class="sidebar-section">
                <div class="section-title">🔒 PRIVATE TRANSMISSIONS</div>
                <ul id="private-rooms-list" class="rooms-list-ul">
                    </ul>
            </div>

            <div class="sidebar-footer-user-panel">
